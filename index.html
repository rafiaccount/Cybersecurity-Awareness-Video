
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Awareness Survey</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
      text-align: center;
    }

    .container {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 20px 0;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #status {
      color: #555;
      line-height: 1.5;
    }

    button, .button {
      display: inline-block;
      background: #1769e0;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
      margin: 8px;
    }

    button:hover, .button:hover {
      background: #0d50b5;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Watch the Video</h1>

    <p>
      Please watch the entire video.
      The survey will open when playback finishes.
    </p>

    <div class="video">
      <div id="player"></div>
    </div>

    <p id="status" role="status" aria-live="polite">
      Loading video...
    </p>

    <button id="startButton" hidden>
      Start Video
    </button>

    <a id="surveyLink" class="button" href="#" hidden>
      Continue to Survey
    </a>
  </div>

  <script>
    // ===== CONFIGURATION =====
    const VIDEO_ID = "AsYi-MZeX6M";
    const FORM_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=HFv4cHjEkEOjr9j_PUzWOWxqva-6j9xOoZgzFkXAuSdUMUdaODk1QTI1WjFCM1lHVUhNVDNRSDRSSS4u";

    let player;
    let finished = false;
    let redirectTimer = null;

    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const surveyLink = document.getElementById("surveyLink");

    surveyLink.href = FORM_URL;

    // Load the official YouTube player API.
    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);

    // YouTube calls this function when its API is ready.
    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: VIDEO_ID,

        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          playsinline: 1,
          rel: 0
        },

        events: {
          onReady: handleReady,
          onStateChange: handleStateChange,
          onError: handleError
        }
      });
    }

    function handleReady(event) {
      // Muted autoplay is more likely to be permitted.
      event.target.mute();
      event.target.playVideo();

      status.textContent =
        "Attempting to start video...";

      // Offer a manual fallback if playback doesn't start.
      setTimeout(() => {
        if (!finished &&
            player &&
            player.getPlayerState() !== YT.PlayerState.PLAYING) {
          startButton.hidden = false;
          status.textContent =
            "If the video did not start, press Start Video.";
        }
      }, 2500);
    }

    startButton.addEventListener("click", () => {
      if (!player || finished) return;

      startButton.hidden = true;
      player.playVideo();

      status.textContent = "Starting video...";
    });

    function handleStateChange(event) {
      if (finished) return;

      if (event.data === YT.PlayerState.PLAYING) {
        startButton.hidden = true;
        status.textContent =
          "Video playing. Please watch until the end.";
      }

      if (event.data === YT.PlayerState.BUFFERING) {
        status.textContent = "Buffering video...";
      }

      if (event.data === YT.PlayerState.PAUSED) {
        status.textContent =
          "Video paused. Resume playback to continue.";
      }

      if (event.data === YT.PlayerState.ENDED) {
        finishVideo();
      }
    }

    function finishVideo() {
      if (finished) return;

      finished = true;
      startButton.hidden = true;
      surveyLink.hidden = false;

      status.textContent =
        "Video completed! Opening the survey...";

      // Brief delay lets the viewer see the completion message.
      redirectTimer = setTimeout(() => {
        window.location.href = FORM_URL;
      }, 700);
    }

    function handleError(event) {
      startButton.hidden = true;

      status.textContent =
        "Unable to load the video. Check the video ID, " +
        "internet connection, and YouTube embedding settings.";

      console.error("YouTube player error:", event.data);
    }
  </script>
</body>
</html>
