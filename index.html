
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video and Survey</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 20px 0;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .button {
      display: inline-block;
      background: #1769e0;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 12px;
    }

    #status {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Watch the Video</h1>
    <p>Please watch the entire video. You will be
       redirected to the survey when it finishes.</p>

    <div class="video">
      <div id="player"></div>
    </div>

    <p id="status">Press Play to begin.</p>

    <a id="surveyLink"
       class="button"
       href="#"
       target="_blank"
       rel="noopener noreferrer">
      Open Survey Manually
    </a>
  </div>

  <script>
    // REPLACE THESE VALUES
    const VIDEO_ID = "AsYi-MZeX6M";
    const FORM_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=HFv4cHjEkEOjr9j_PUzWOWxqva-6j9xOoZgzFkXAuSdUMUdaODk1QTI1WjFCM1lHVUhNVDNRSDRSSS4u";

    document.getElementById("surveyLink").href = FORM_URL;

    // Load YouTube's embedded player API
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: VIDEO_ID,

        playerVars: {
          playsinline: 1,
          rel: 0
        },

        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady() {
      document.getElementById("status").textContent =
        "Ready! Press Play to start the video.";
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        document.getElementById("status").textContent =
          "Video playing. The survey opens when it ends.";
      }

      if (event.data === YT.PlayerState.ENDED) {
        document.getElementById("status").textContent =
          "Video finished! Opening your survey...";

        window.location.href = FORM_URL;
      }
    }

    function onPlayerError() {
      document.getElementById("status").textContent =
        "The video could not be played. Please check the video settings.";
    }
  </script>
</body>
</html>
